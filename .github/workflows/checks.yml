name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # check:version diffs pm-status.py against the last release tag; the default
        # shallow checkout has no tags, which would make that check silently pass.
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify shared-script payload copies are in sync
      run: npm run check:scripts
    - name: Verify documentation matches the code it describes
      run: npm run check:docs
    - name: Verify pm-status.py's version tracks its content
      run: npm run check:version
    - name: pm-status.py unit tests
      run: |
        python3 -m pip install --quiet 'ruamel.yaml>=0.18'
        python3 skills/_shared/tests/test-pm-status.py
    - uses: astral-sh/setup-uv@v5
    - name: write-module-config.py unit tests
      run: uv run skills/_shared/tests/test-write-module-config.py
    - name: drift-report.py unit tests
      run: uv run --with pyyaml skills/l3io-pm-sync/scripts/tests/test-drift-report.py
