name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify shared-script payload copies are in sync
      run: npm run check:scripts
    - name: pm-status.py unit tests
      run: |
        python3 -m pip install --quiet 'ruamel.yaml>=0.18'
        python3 skills/_shared/tests/test-pm-status.py
