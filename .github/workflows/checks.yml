name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - uses: astral-sh/setup-uv@v10.2.0
    # No actions/setup-python step: every Python entry point below is a PEP-723 script
    # invoked through `uv run`, which reads each script's own `requires-python` header and
    # provisions a matching interpreter itself (downloading a managed CPython if the runner's
    # system Python doesn't satisfy it). setup-uv above installs uv; that is the only Python
    # toolchain this workflow needs.
    # Every `npm run check:*` gate below imports from node_modules (the YAML, shell and CSV
    # parsers the checkers use instead of hand-rolled ones), so the install has to come first:
    # a gate that ran before it would fail on ERR_MODULE_NOT_FOUND. See
    # docs/adr/0007-ci-installs-npm-dependencies.md.
    - name: Verify package.json and package-lock.json are in sync
      # This runs BEFORE `npm ci` on purpose. `npm ci` also refuses when the two disagree,
      # but its failure message is a wall of usage output that buries the actual cause,
      # and it's the first step so a red run says nothing about which gate found the drift.
      # `npm ls --package-lock-only` is instantaneous, network-free, and prints a clean
      # "Missing: X from lock file" summary. If the CI-red-for-a-week pattern of 2026-09
      # recurs, this line is the one whose failure names it.
      run: npm ls --package-lock-only --all --depth=0
    - name: Install check-tooling dependencies
      run: npm ci
    # Fails on high/critical only. Both advisories this repo actually hit (brace-expansion,
    # handlebars) were high or critical and both were dev-only transitives of the
    # conventional-changelog tree -- so a dev-only finding DOES fail the build here, which is
    # deliberate: it is how we find out. Moderate and low are excluded because that same
    # legacy subtree generates them steadily, and a gate people learn to ignore is worse than
    # no gate. This step only runs on push/PR; audit.yml carries the scheduled half, which is
    # the one that catches an advisory published in a week with no commits.
    - name: Dependency audit (high and critical)
      run: npm run check:audit
    - name: Verify shared-script payload copies are in sync
      run: npm run check:scripts
    - name: Verify documentation matches the code it describes
      run: npm run check:docs
    - name: check-docs self-tests
      run: npm run test:scripts
    - name: Verify pm-status.py's version tracks its content
      run: npm run check:version
    - name: Verify per-skill payload manifests match the payload
      run: npm run check:manifest
    - name: Verify module structure — one module.yaml per module, correctly homed
      run: npm run check:module
    # BMad Builder's own deterministic scanners, over this package's skills. bmb ships them
    # in the `bmad-builder` npm package, which is a devDependency, so `npm ci` above is all
    # the setup this needs -- no BMad install, which matters because `.claude/skills/` is
    # gitignored and a real install is not available to CI. Exemptions for the core
    # conventions this package rejects live in scripts/check-bmb.mjs, each with a test that
    # plants a violation it must not swallow.
    # Ruff over every Python file in skills/. The version is PINNED in the npm script, and
    # ruff.toml carries no `select` list on purpose: the rule set is whatever that pinned
    # version enables, so it cannot drift from a hand-kept list, and a bump is a visible diff.
    # This ran nowhere before -- bmb's scan-scripts.py has a ruff arm, but it shells to
    # `uv run ruff`, which failed to spawn here and was swallowed, so check:bmb was passing
    # over ~12,000 unlinted lines.
    - name: Python lint (ruff)
      run: npm run check:lint:py
    # standards-shell.md — a reference this package SHIPS to consumers — requires
    # "ShellCheck clean in CI, not just locally", and the repo shipped shell with no gate.
    # The gate FAILS (exit 2) rather than skipping when shellcheck is absent: a linter that
    # cannot run has told you nothing, and reporting that as a pass is how check:bmb came to
    # report clean over Python it had never read.
    - name: Shell lint (bash -n + ShellCheck)
      run: npm run check:lint:sh
    - name: BMad Builder skill scanners
      run: npm run check:bmb
    # Every Python suite under skills/**/tests/, DISCOVERED FROM DISK. This replaced ten
    # hand-written steps, and the reason is that the hand-written list was wrong: seven
    # suites (test-engine.py, its five reader suites, and test-state-record.py) existed and
    # were never named here, so CI had never once run the tests for the migration engine
    # that deletes a project's source layout. A list cannot notice what is missing from it
    # (CLAUDE.md §4). Each suite carries its own PEP-723 header, so no per-suite flags
    # belong here either.
    - name: Python unit tests (discovered, not enumerated)
      run: npm run test:python
