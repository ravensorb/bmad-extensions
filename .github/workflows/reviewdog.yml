name: reviewdog
on: [pull_request]
jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: detect-secrets
      uses: reviewdog/action-detect-secrets@v0.31.0
      with:
        reporter: github-pr-review
        level: error
        fail_on_error: true
