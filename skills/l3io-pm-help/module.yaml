code: l3io-pm
name: "LiquidLogicLabs PM"
description: "PM orchestration for LiquidLogicLabs delivery teams — dependency-aware phased planning, full epic and sprint execution, closure quality gates, progress reporting, and GitHub Issues sync."
module_version: 2.5.0
default_selected: false
module_greeting: >
  LiquidLogicLabs PM module is configured!
  Use /l3io-pm-plan to build the execution plan.
  Use /l3io-pm-execute to run the plan.
  Use /l3io-pm-help to get a state-aware next-action recommendation.
  Use /l3io-pm-sync to mirror state to GitHub Issues.
post-install-notes: >
  Required BMad skills, all from the official bmm module: bmad-create-story, bmad-dev-story,
  bmad-code-review, bmad-qa-generate-e2e-tests, bmad-retrospective,
  bmad-review-adversarial-general. bmm is not part of core, so install it with
  `--modules bmm` if you have not already.
  Optional: bmad-ux-review (UX phases skip when absent), l3io-arch-review (epic architecture
  gate and drift reviews), l3io-sec-redteam (closure security review).
  /l3io-pm-sync additionally needs an authenticated GitHub CLI (gh) or a configured GitHub
  MCP server.
  Requires uv on PATH: the Python helpers run via `uv run`.
