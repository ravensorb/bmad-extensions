[workflow]
activation_steps_prepend = []
activation_steps_append  = []
persistent_facts         = ["file:{project-root}/**/project-context.md"]

# Output destination for the generated execution plan
# "markdown" — save plan to planning_artifacts as execution-plan-{date}.md
# "console"  — display only, no file written
plan_output              = "markdown"   # "markdown" | "console"

# Include ready-to-run /l3io-pm-epic-execute dispatch lines in the plan
include_dispatch_lines   = true         # true | false

# Include per-phase and critical-path wall-clock estimates in the plan
include_estimates        = true         # true | false
