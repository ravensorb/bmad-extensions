[workflow]
activation_steps_prepend = []
activation_steps_append  = []
persistent_facts         = ["file:{project-root}/**/project-context.md"]

# Parallelism controls
# "auto"     — the orchestrator sizes each batch itself: effective = min(max_parallel_subagents,
#              parallel_ceiling, safe_batch_size), where safe_batch_size comes from the dependency
#              graph + file-overlap + no-concurrent-status-write safety checks. Let the agent decide.
# "adaptive" — same safety checks but bounded by the (lower) legacy behaviour.
# "off"      — force sequential (effective = 1).
parallel_mode            = "auto"       # "auto" | "adaptive" | "off"
max_parallel_subagents   = 4            # preferred batch width when work is provably independent
parallel_ceiling         = 12           # hard upper bound the orchestrator may never exceed

# Deferred file cleanup: collect rm commands into a script and batch-execute at sprint close
# instead of running inline. Useful when the security sandbox requires explicit approval for rm.
deferred_file_cleanup    = false        # true | false

# Calibration sampling granularity for scope + fix learning (see references/metrics-contract.md).
# "story"  — each done story emits a scope/fix sample; converges after ~3 stories (best for short projects)
# "sprint" — scope/fix learned in aggregate per sprint; converges after ~3 sprints (fewer, coarser samples)
# Closure calibration is always per-sprint / per-epic regardless (closure only happens at those levels).
calibration_granularity  = "story"      # "story" | "sprint"

# Story technical-AC gate: after a story is created/prepared, verify it carries *technical* acceptance
# criteria (interfaces, data contracts, error/edge handling, observability, security, testability) against
# the l3io-arch standards checklist — enrich when missing — before the story reaches ready-for-dev, so
# implementation isn't left to each dev agent's discretion. When l3io-arch-review is installed its
# standards drive the checklist; otherwise a built-in technical-AC checklist is used.
# "block"  — a story cannot reach ready-for-dev until technical ACs are present (recommended).
# "warn"   — enrich and warn, but do not block.
# "off"    — disable the gate.
story_technical_ac_gate  = "block"      # "block" | "warn" | "off"

# ATDD: generate red-phase acceptance test scaffolds (via bmad-testarch-atdd) between story prep and dev.
# Skipped automatically when bmad-testarch-atdd is not installed, regardless of this flag.
# Set to false to disable even when the skill is present.
atdd_enabled             = true         # true | false
